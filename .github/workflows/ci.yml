name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Use placeholder Firebase config (no real credentials in CI)
        run: cp app/google-services.json.example app/google-services.json
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unit tests (Firestore rules run against the local emulator)
        run: npx --yes firebase-tools@13 emulators:exec --only firestore,auth --project demo-test "./gradlew :app:testDebugUnitTest --no-daemon"
